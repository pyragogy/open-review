[build]
  command   = "npm run build"
  publish   = "dist"

[build.environment]
  NODE_VERSION = "22"

# Security headers + CSP — port from Obliqo svelte.config.js, scoped to
# Open Review's surface (no Appwrite, no n8n, no LemonSqueezy). Plausible
# self-hosted analytics is the only outbound script. Giscus loads from
# giscus.app, scripts/styles/iframes only.

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "no-referrer"
    Permissions-Policy     = "geolocation=(), microphone=(), camera=(), payment=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://plausible.pyragogy.org https://giscus.app; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https://plausible.pyragogy.org https://api.github.com; frame-src https://giscus.app; frame-ancestors 'none'; base-uri 'self'; object-src 'none'"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Phase II waitlist — Netlify Forms picks up forms with `data-netlify`
# attribute automatically. No backend code; submissions appear in the
# Netlify dashboard.
